version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    volumes:
      - ./backend/skillgap.db:/app/skillgap.db
      - ./backend/uploads:/app/uploads
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./skillgap.db
      # Add your Gemini API Key here or in a .env file
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "5501:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    restart: unless-stopped
