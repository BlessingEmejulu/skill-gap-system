<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in or sign up | SkillGap.ng</title>
<link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<header class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="brand">
      <span class="brand-mark" aria-hidden="true"></span> SkillGap<span style="color:var(--color-primary)">.ng</span>
    </a>
    <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode"></button>
  </div>
</header>

<main id="main" class="container" style="max-width:440px; padding-top:var(--space-6); padding-bottom:var(--space-7);">
  <div class="card" style="padding:var(--space-5);">

    <div role="tablist" aria-label="Authentication" style="display:flex; border:1px solid var(--color-border); border-radius:var(--radius-sm); overflow:hidden; margin-bottom:var(--space-5);">
      <button role="tab" id="tab-login" aria-selected="true" aria-controls="panel-login" class="btn" style="flex:1; border-radius:0; background:var(--color-primary); color:#fff;" data-tab="login">Log in</button>
      <button role="tab" id="tab-register" aria-selected="false" aria-controls="panel-register" class="btn" style="flex:1; border-radius:0; background:transparent; color:var(--color-text);" data-tab="register">Sign up</button>
    </div>

    <!-- LOGIN PANEL -->
    <form id="panel-login" role="tabpanel" aria-labelledby="tab-login" novalidate>
      <h1 style="font-size:1.5rem;">Welcome back</h1>
      <p style="margin-bottom:var(--space-4);">Log in to see your latest employability score.</p>

      <div class="field">
        <label for="login-email">Email address</label>
        <input type="email" id="login-email" name="email" autocomplete="email" required />
        <p class="error-text" id="login-email-error" hidden></p>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input type="password" id="login-password" name="password" autocomplete="current-password" required />
        <p class="error-text" id="login-password-error" hidden></p>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="login-submit">Log in</button>
      <p style="text-align:center; margin-top:var(--space-4); font-size:0.875rem;">
        <a href="#" id="forgot-password-link">Forgot your password?</a>
      </p>
    </form>

    <!-- REGISTER PANEL -->
    <form id="panel-register" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
      <h1 style="font-size:1.5rem;">Create your account</h1>
      <p style="margin-bottom:var(--space-4);">Takes about two minutes.</p>

      <div class="field">
        <label for="register-role">I am a...</label>
        <select id="register-role" name="role">
          <option value="graduate">Graduate / Student</option>
          <option value="employer">Employer</option>
        </select>
      </div>
      <div class="field">
        <label for="register-name">Full name</label>
        <input type="text" id="register-name" name="full_name" autocomplete="name" required minlength="2" />
        <p class="error-text" id="register-name-error" hidden></p>
      </div>
      <div class="field">
        <label for="register-email">Email address</label>
        <input type="email" id="register-email" name="email" autocomplete="email" required />
        <p class="error-text" id="register-email-error" hidden></p>
      </div>
      <div class="field">
        <label for="register-password">Password</label>
        <input type="password" id="register-password" name="password" autocomplete="new-password" required minlength="8" />
        <p class="error-text" id="register-password-error">Use at least 8 characters.</p>
      </div>

      <button type="submit" class="btn btn-primary btn-block" id="register-submit">Create account</button>
    </form>

  </div>
</main>

<script src="assets/js/api.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
