<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skill Assessment | SkillGap.ng</title>
<link rel="stylesheet" href="assets/css/main.css" />
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<div class="app-shell">
  <aside class="sidebar" aria-label="Dashboard navigation">
    <a href="index.html" class="brand" style="margin-bottom:var(--space-4);">
      <span class="brand-mark" aria-hidden="true"></span> SkillGap<span style="color:var(--color-primary)">.ng</span>
    </a>
    <a href="dashboard.html" class="sidebar-link"> Dashboard</a>
    <a href="profile.html" class="sidebar-link"> Profile</a>
    <a href="assessment.html" class="sidebar-link active"> Skill assessment</a>
    <a href="prediction.html" class="sidebar-link"> Prediction</a>
    <div style="margin-top:auto; padding-top:var(--space-4); border-top:1px solid var(--color-border);">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode" style="margin-bottom:var(--space-3);"></button>
      <button class="btn btn-secondary btn-block btn-sm" id="logout-btn">Log out</button>
    </div>
  </aside>

  <div>
    <header class="navbar" style="position:sticky;">
      <div class="navbar-inner" style="max-width:none;">
        <button class="nav-toggle" data-sidebar-toggle aria-label="Open sidebar menu" style="display:block;">
          <span></span><span></span><span></span>
        </button>
        <h2 style="margin:0; font-size:1.1rem;">Skill Assessment</h2>
        <div></div>
      </div>
    </header>

    <main id="main" class="main-content" style="max-width:760px;">
      <p class="reveal" style="margin-bottom:var(--space-4);">
        Rate your proficiency in each skill from 0–100. Your ratings feed directly into your
        employability prediction and skill-gap matching against job postings.
      </p>

      <div class="field reveal" style="max-width:320px;">
        <label for="category-filter">Filter by category</label>
        <select id="category-filter">
          <option value="all">All categories</option>
          <option value="technical">Technical</option>
          <option value="soft">Soft skills</option>
          <option value="digital_literacy">Digital literacy</option>
          <option value="industry_readiness">Industry readiness</option>
        </select>
      </div>

      <div id="skills-container" class="reveal" style="margin-top:var(--space-4);">
        <div class="skeleton" style="height:64px; margin-bottom:var(--space-3);"></div>
        <div class="skeleton" style="height:64px; margin-bottom:var(--space-3);"></div>
        <div class="skeleton" style="height:64px;"></div>
      </div>
    </main>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/assessment.js?v=2"></script>
</body>
</html>
