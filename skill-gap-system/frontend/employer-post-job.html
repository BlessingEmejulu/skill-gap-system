<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Post a New Job | SkillGap.ng</title>
<link rel="stylesheet" href="assets/css/main.css" />
<style>
  .skill-row {
    display: flex;
    gap: var(--space-3);
    align-items: center;
    margin-bottom: var(--space-2);
    padding: var(--space-2);
    border: 1px solid var(--color-border);
    border-radius: var(--radius);
    background: var(--color-surface);
  }
  .skill-row > div {
    flex: 1;
  }
</style>
</head>
<body>
<a href="#main" class="skip-link">Skip to content</a>

<div class="app-shell">
  <aside class="sidebar" aria-label="Dashboard navigation">
    <a href="index.html" class="brand" style="margin-bottom:var(--space-4);">
      <span class="brand-mark" aria-hidden="true"></span> SkillGap<span style="color:var(--color-primary)">.ng</span>
    </a>
    <a href="employer-dashboard.html" class="sidebar-link"> Dashboard</a>
    <a href="employer-post-job.html" class="sidebar-link active"> Post a new job</a>
    
    <div style="margin-top:auto; padding-top:var(--space-4); border-top:1px solid var(--color-border);">
      <button class="theme-toggle" data-theme-toggle aria-label="Toggle dark mode" style="margin-bottom:var(--space-3);"></button>
      <button class="btn btn-secondary btn-block btn-sm" id="logout-btn">Log out</button>
    </div>
  </aside>

  <div>
    <header class="navbar" style="position:sticky;">
      <div class="navbar-inner" style="max-width:none;">
        <button class="nav-toggle" data-sidebar-toggle aria-label="Open sidebar menu" style="display:block;">
          <span></span><span></span><span></span>
        </button>
        <h2 style="margin:0; font-size:1.1rem;">Post a New Job</h2>
        <div></div>
      </div>
    </header>

    <main id="main" class="main-content">
      <div class="card reveal">
        <form id="job-form">
          <div style="display: grid; gap: var(--space-4); margin-bottom: var(--space-5);">
            <div class="field">
              <label for="job-title">Job Title</label>
              <input type="text" id="job-title" class="input" required placeholder="e.g. Senior Data Analyst" />
            </div>
            
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: var(--space-4);">
              <div class="field">
                <label for="job-industry">Industry</label>
                <input type="text" id="job-industry" class="input" required placeholder="e.g. Finance" />
              </div>
              <div class="field">
                <label for="job-location">Location</label>
                <input type="text" id="job-location" class="input" required placeholder="e.g. Lagos, Nigeria or Remote" />
              </div>
            </div>

            <div class="field">
              <label for="job-experience">Minimum Experience (Years)</label>
              <input type="number" id="job-experience" class="input" min="0" step="0.5" value="0" required />
            </div>

            <div class="field">
              <label for="job-description">Job Description</label>
              <textarea id="job-description" class="input" rows="4" required placeholder="Describe the role..."></textarea>
            </div>
          </div>

          <h3 style="margin-bottom: var(--space-3); padding-top: var(--space-4); border-top: 1px solid var(--color-border);">Required Skills</h3>
          <p style="font-size: 0.875rem; color: var(--color-muted); margin-bottom: var(--space-4);">
            Select the skills required for this job and rate their importance from 1 (Nice to have) to 5 (Crucial).
          </p>

          <div id="skills-container">
            <!-- Dynamic skill rows go here -->
          </div>
          
          <button type="button" id="add-skill-btn" class="btn btn-secondary btn-sm" style="margin-bottom: var(--space-5);">
            + Add another skill requirement
          </button>

          <div style="padding-top: var(--space-4); border-top: 1px solid var(--color-border); display: flex; justify-content: flex-end; gap: var(--space-3);">
            <a href="employer-dashboard.html" class="btn btn-secondary">Cancel</a>
            <button type="submit" id="submit-job-btn" class="btn btn-primary">Post Job</button>
          </div>
        </form>
      </div>
    </main>
  </div>
</div>

<script src="assets/js/api.js?v=2"></script>
<script src="assets/js/theme.js"></script>
<script src="assets/js/main.js"></script>
<script src="assets/js/employer-post-job.js"></script>
</body>
</html>
